name: PR Review Workflow (Example)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch naming
        run: |
          branch=${{ github.head_ref }}
          if [[ ! $branch =~ ^(feature|bugfix|hotfix|release|docs|test|refactor)/[a-zA-Z0-9-]+$ ]]; then
            echo "❌ Branch name '$branch' doesn't follow conventions"
            echo "Expected format: feature/description, bugfix/description, etc."
            exit 1
          fi
          echo "✅ Branch name is valid: $branch"

      - name: Validate commit messages
        run: |
          git fetch origin main --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            range="origin/main..HEAD"
          else
            range="HEAD"
          fi
          git log --format=%B "$range" | grep -E '^\[(FEAT|FIX|DOCS|TEST|REFACTOR)\]' || \
          (echo "❌ Commits must start with [FEAT], [FIX], [DOCS], [TEST], or [REFACTOR]"; exit 1)
          echo "✅ All commits follow format"

      - name: Check for security issues
        run: |
          echo "Scanning for hardcoded secrets..."
          python3 -m pip install --upgrade pip || true
          python3 -m pip install truffleHog || true
          truffleHog filesystem . --fail --max-depth 3 || true

      - name: Validate file sizes
        run: |
          echo "Checking for uncommonly large files..."
          find . -size +10M -not -path './.git/*' | while read file; do
            echo "⚠️  Large file: $file"
          done

      - name: Generate summary
        if: always()
        run: |
          echo "## ✅ PR Review Workflow: Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Branch naming valid" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Commit messages valid" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret scan executed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ File size scan executed" >> $GITHUB_STEP_SUMMARY

  tests:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ hashFiles('pipeline-mcp/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            pipeline-mcp/package-lock.json
            pipeline-mcp/package.json

      - name: pipeline-mcp install
        if: ${{ hashFiles('pipeline-mcp/package.json') != '' }}
        working-directory: pipeline-mcp
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: pipeline-mcp typecheck
        if: ${{ hashFiles('pipeline-mcp/package.json') != '' }}
        working-directory: pipeline-mcp
        run: npm run typecheck

      - name: pipeline-mcp tests
        if: ${{ hashFiles('pipeline-mcp/package.json') != '' }}
        working-directory: pipeline-mcp
        run: npm test

      - name: No project tests found
        if: ${{ hashFiles('pipeline-mcp/package.json') == '' }}
        run: echo "No pipeline-mcp package present; skipping tests."

  coderabbit-review:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeRabbit Review
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          language: en-US
          max_files_to_summarize: 20

  sourcery-review:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ secrets.SOURCERY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sourcery Review
        uses: sourcery-ai/sourcery-github-bot@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          request_review: author
          sourcery_token: ${{ secrets.SOURCERY_TOKEN }}
