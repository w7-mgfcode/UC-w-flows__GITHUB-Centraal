name: AI Code Review with CodeRabbit & Sourcery

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.repository }}-${{ github.event.number }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coderabbit-review:
    runs-on: ubuntu-latest
    name: CodeRabbit Review
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeRabbit Review
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          language: en-US
          max_files_to_summarize: 20

  sourcery-review:
    runs-on: ubuntu-latest
    name: Sourcery Code Quality Review
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sourcery Review
        uses: sourcery-ai/sourcery-github-bot@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          request_review: author
          sourcery_token: ${{ secrets.SOURCERY_TOKEN }}
